<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTools</title>
    <style>
      /* 首帧防闪：与 index.css 的主题色保持一致 */
      html { background: #0d1117; }
      html[data-theme="light"] { background: #f6f8fa; }
    </style>
    <script>
      // 首帧主题预置（Tauri 的 store 在 Rust 侧，这里镜像一份到 localStorage 供首帧读取）
      // 依次认 ui.themeMode（dark|light|system）→ 旧键 ui.theme（dark|light，升级兜底）→ 跟随系统
      try {
        var m = JSON.parse(localStorage.getItem("ui.themeMode"));
        if (m !== "dark" && m !== "light" && m !== "system") {
          var legacy = JSON.parse(localStorage.getItem("ui.theme"));
          m = legacy === "light" || legacy === "dark" ? legacy : "system";
        }
        var light = m === "light" || (m === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        if (light) document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
